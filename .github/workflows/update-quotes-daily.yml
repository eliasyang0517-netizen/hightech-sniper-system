name: Update stock quotes (daily, 3-source)

on:
  workflow_dispatch:
  schedule:
    # 16:10 Asia/Shanghai on weekdays (after market close). GitHub cron uses UTC.
    - cron: "10 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-data-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python daily/scripts/update_quotes.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/data/stocks.json daily/data/meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh market quotes (daily, 3-source)"
          git push
