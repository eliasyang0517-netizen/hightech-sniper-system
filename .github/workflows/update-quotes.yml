name: Update stock quotes

on:
  workflow_dispatch:
  schedule:
    # 09:00-15:59 Asia/Shanghai, weekdays. GitHub cron uses UTC.
    - cron: "*/15 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_quotes.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh market quotes"
          git push
