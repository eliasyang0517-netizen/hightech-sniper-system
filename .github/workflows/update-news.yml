name: Update stock announcements and news

on:
  workflow_dispatch:
  schedule:
    # 18:45 Asia/Shanghai, weekdays. GitHub cron uses UTC.
    - cron: "45 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_news.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh announcements and news"
          git push
